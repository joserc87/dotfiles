[config]
# Match monitors by EDID instead of connector name.
# The external displays are driven through a DisplayLink USB dock (evdi),
# whose connector names (DVI-I-2-1, HDMI-1-0, ...) are assigned in a
# non-deterministic order and get swapped across boots/reconnects.
# Matching on EDID makes profile detection and layout stable regardless.
match-edid=1
