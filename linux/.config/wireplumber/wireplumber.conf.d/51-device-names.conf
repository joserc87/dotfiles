# Give USB audio devices their real names where the reported one is wrong.
monitor.alsa.rules = [
  # The Audioengine 2+ uses a CSR chip (0a12:4007) that the USB ID database
  # names "Mpow HC5 Headset in charging mode".
  {
    matches = [
      { device.name = "~alsa_card.usb-Audioengine_LLC_Audioengine_2_.*" }
    ]
    actions = {
      update-props = {
        device.description = "Audioengine 2+"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Audioengine_LLC_Audioengine_2_.*" }
    ]
    actions = {
      update-props = {
        node.description = "Audioengine 2+"
      }
    }
  }
  # The RODE NT-USB sometimes boots without its own config and shows up as the
  # bare C-Media chip inside it (0d8c:016c, "USB Advanced Audio Device").
  {
    matches = [
      { device.name = "~alsa_card.usb-C-Media_Electronics_Inc._USB_Advanced_Audio_Device-.*" }
    ]
    actions = {
      update-props = {
        device.description = "RODE NT-USB"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_(output|input).usb-C-Media_Electronics_Inc._USB_Advanced_Audio_Device-.*" }
    ]
    actions = {
      update-props = {
        node.description = "RODE NT-USB Analog Stereo"
      }
    }
  }
]
